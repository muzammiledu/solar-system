name: build-and-push
run-name: Build and Push ${{ github.event.inputs.app_name }} to ${{ github.event.inputs.registry_type }}

on:
  workflow_dispatch:
    inputs:
      registry_type:
        description: Select registry (acr or ghcr)
        required: true
        default: acr
        type: choice
        options: [acr, ghcr]

      acr_name:
        description: Azure Container Registry name (only used if registry_type=acr)
        required: false
        default: ""
        type: string

      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

      app_name:
        description: App folder name (e.g., solar-system)
        required: true
        default: solar-system
        type: string

      image_tag:
        description: Docker image tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

env:
  ARM_CLIENT_ID: ${{ secrets.LZ_SPN_APP_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.LZ_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.LZ_TENANT_ID }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: elstudio/action-install-azure-cli@v1

      - name: Azure login (OIDC)
        if: ${{ github.event.inputs.registry_type == 'acr' }}
        uses: azure/login@v1.6.1
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Set environment variables
        shell: bash
        run: |
          echo "IMAGE_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV

          if [ "${{ github.event.inputs.registry_type }}" == "acr" ]; then
            if [ -z "${{ github.event.inputs.acr_name }}" ]; then
              echo "❌ You must provide acr_name when registry_type=acr."
              exit 1
            fi
            echo "REGISTRY=${{ github.event.inputs.acr_name }}.azurecr.io" >> $GITHUB_ENV
          else
            echo "REGISTRY=ghcr.io/${{ github.repository_owner }}" >> $GITHUB_ENV
          fi

          echo "IMAGE_FULL_NAME=${{ env.REGISTRY }}/${{ github.event.inputs.app_name }}:${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          echo "✅ Using image: $IMAGE_FULL_NAME"

      - name: Login to ACR
        if: ${{ github.event.inputs.registry_type == 'acr' }}
        shell: bash
        run: |
          echo "🔑 Logging into ACR: ${{ github.event.inputs.acr_name }}"
          az acr login --name ${{ github.event.inputs.acr_name }}

      - name: Login to GHCR
        if: ${{ github.event.inputs.registry_type == 'ghcr' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          # dynamically build correct app folder
          context: ./workloads/${{ github.event.inputs.app_name }}
          file: ./workloads/${{ github.event.inputs.app_name }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FULL_NAME }}

      - name: Verify Image (ACR only)
        if: ${{ github.event.inputs.registry_type == 'acr' }}
        shell: bash
        run: |
          echo "🔍 Verifying image in ACR..."
          az acr repository show \
            --name "${{ github.event.inputs.acr_name }}" \
            --image "${{ github.event.inputs.app_name }}:${{ github.event.inputs.image_tag }}" \
            --output table

      - name: Deployment Summary
        shell: bash
        run: |
          echo "### ✅ Build & Push Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Registry Type:** ${{ github.event.inputs.registry_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry URL:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**ACR Name:** ${{ github.event.inputs.acr_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**App Name:** ${{ github.event.inputs.app_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Full Image:** \`${{ env.IMAGE_FULL_NAME }}\`" >> $GITHUB_STEP_SUMMARY
